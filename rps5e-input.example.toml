# rps5e host input settings.
#
# Copy to ./rps5e-input.toml (working directory) or
# $XDG_CONFIG_HOME/rps5e/rps5e-input.toml (~/.config/rps5e/...), or point
# RPS5E_INPUT_CONFIG at it. Without a file the built-in settings below are
# used. The rps5e-gui frontend edits ~/.config/rps5e/rps5e-input.toml.
#
# Per-game profiles: profiles/<TITLE_ID>.toml next to this file (e.g.
# ~/.config/rps5e/profiles/PPSA10112.toml). A profile uses this format, is
# read on top of this file (list only what differs) and can be switched off
# with "[profile]" enabled=false.
#
# Every section and key is optional; names are case-insensitive.
# RPS5E_NO_HOST_INPUT=1 ignores all host input (neutral pad).

[device]
# Player 1 input:
#   auto            controller + keyboard + mouse together
#   keyboard_mouse  keyboard and mouse act as the pad (controllers ignored)
#   keyboard        keyboard only, the mouse is ignored ([keyboard_bindings])
#   controller      physical controller only (keyboard keeps F1, F2, F10, F11, F12, F8)
# mode = "auto"
# Player 1 controller: empty for the first free one, else its serial number or part
# of its name ("DualSense", "Xbox"). Controllers can be hot-plugged.
# controller = ""

[players]
# Local players 1..4; each is a signed-in user with its own pad. Players 2-4
# use controllers (empty: next free one).
# count = 1
# player2 = ""
# player3 = ""
# player4 = ""

# Keyboard/mouse bindings (modes auto and keyboard_mouse). Every action listed
# REPLACES its built-in bindings; actions not listed keep them, except inputs a
# listed action uses (one input, one action). A value is one source or a list
# of alternates; [] unbinds. Sources:
#   KEY:<name>     SDL key names (Return, Space, Left Shift, Keypad 4, F11, ...)
#                  or winit key codes (Enter, ShiftLeft, Numpad4, KeyA, ...).
#                  A key name is a physical key position named after the US
#                  layout: "C" is the key right of X whatever the active
#                  layout types there (Russian "с", ...), so bindings work
#                  on every layout and do not change when it is switched.
#   MOUSE:<btn>    Left, Middle, Right, X1, X2
#   WHEEL:Up|Down  pad buttons only (held for 80 ms per notch)
# Actions: Cross Circle Triangle Square L1 R1 L2 R2 L3 R3 Options Up Right Down
#   Left TouchPad LeftStickLeft LeftStickRight LeftStickUp LeftStickDown
#   RightStickLeft RightStickRight RightStickUp RightStickDown TouchLeft
#   TouchRight ToggleMouse ReleaseMouse ToggleFullscreen TogglePerfOverlay ToggleMenu
#   ShowControls SpeakerVolume VibrationIntensity TriggerEffectIntensity (step the
#   controller level, cycling; unbound by default)
#   Create Mute TiltForward TiltBack TiltLeft TiltRight TurnLeft TurnRight Shake
#   MouseMotion TouchpadMode TapLeft TapCenter TapRight SwipeUp SwipeDown
#   SwipeLeft SwipeRight TwoFingerTouch
# Files written by an earlier version that still hold that version's built-in
# bindings unchanged are read with today's defaults.
[bindings]
# Built-in defaults:
# Cross            = ["KEY:Space", "KEY:Return"]
# Circle           = "KEY:C"
# Square           = "KEY:R"
# Triangle         = "KEY:F"
# L1               = "KEY:Q"
# R1               = "KEY:E"
# L2               = "MOUSE:Right"      # aim
# R2               = "MOUSE:Left"       # fire
# L3               = ["KEY:Left Shift", "KEY:Right Shift"]
# R3               = ["KEY:Left Ctrl", "KEY:Right Ctrl"]
# Options          = "KEY:Escape"
# Up               = ["KEY:Up", "WHEEL:Up"]
# Right            = "KEY:Right"
# Down             = ["KEY:Down", "WHEEL:Down"]
# Left             = "KEY:Left"
# LeftStickLeft    = "KEY:A"
# LeftStickRight   = "KEY:D"
# LeftStickUp      = "KEY:W"
# LeftStickDown    = "KEY:S"
# RightStickLeft   = "KEY:J"            # used when the right stick is on its keys
# RightStickRight  = "KEY:L"
# RightStickUp     = "KEY:I"
# RightStickDown   = "KEY:K"
# TouchPad         = "KEY:Tab"          # touch pad click (a finger in the middle unless one is down)
# TouchLeft        = []                 # touch pad click on the left half
# TouchRight       = []                 # touch pad click on the right half
# ToggleMouse      = "KEY:F9"           # capture the mouse: it drives the stick in mouse mode
# ReleaseMouse     = "KEY:Escape"       # leave capture or touch pad mode (Escape still presses Options)
# ToggleFullscreen = "KEY:F11"
# TogglePerfOverlay = "KEY:F10"     # performance overlay (FPS, frame times, CPU/GPU)
# ToggleMenu = "KEY:F1"            # in-game menu (keyboard keys only; the PS button also opens it)
# ShowControls     = "KEY:F2"           # hold: the current bindings over the running game (keyboard keys only)
# Create           = "KEY:F12"          # the Create button: a screenshot of the game window
# Mute             = "KEY:F8"           # the mute button: game sound off / on
# Motion sensors (held: the controller tilts and comes back level on release):
# TiltForward      = "KEY:Keypad 8"     # far edge down
# TiltBack         = "KEY:Keypad 2"     # far edge up
# TiltLeft         = "KEY:Keypad 4"     # left grip down
# TiltRight        = "KEY:Keypad 6"     # right grip down
# TurnLeft         = "KEY:Keypad 7"     # yaw
# TurnRight        = "KEY:Keypad 9"
# Shake            = "KEY:Keypad 5"     # a half-second shake
# MouseMotion      = "MOUSE:Middle"     # while held the mouse turns the controller (gyro aiming)
# Touch pad:
# TouchpadMode     = "KEY:Keypad 0"     # numpad 1-9 become touch zones (7 8 9 top row), two
#                                       # keys = two fingers; the mouse moves a finger (left
#                                       # button touches, right button clicks)
# TapLeft          = []                 # a finger without a click while held
# TapCenter        = "KEY:PageUp"
# TapRight         = []
# SwipeUp          = "KEY:Home"
# SwipeDown        = "KEY:End"
# SwipeLeft        = "KEY:Delete"
# SwipeRight       = "KEY:PageDown"
# TwoFingerTouch   = "KEY:Insert"       # two fingers while held

# Keyboard-only bindings (mode keyboard): same format, KEY sources only
# (no ToggleMouse, ReleaseMouse or MouseMotion).
[keyboard_bindings]
# Cross            = ["KEY:Space", "KEY:Return"]
# Circle           = "KEY:C"
# Square           = "KEY:R"
# Triangle         = "KEY:F"
# L1               = "KEY:Q"
# R1               = "KEY:E"
# L2               = "KEY:1"
# R2               = "KEY:3"
# L3               = "KEY:Left Shift"
# R3               = "KEY:O"
# Options          = "KEY:Escape"
# Up               = "KEY:Up"
# Right            = "KEY:Right"
# Down             = "KEY:Down"
# Left             = "KEY:Left"
# LeftStickLeft    = "KEY:A"
# LeftStickRight   = "KEY:D"
# LeftStickUp      = "KEY:W"
# LeftStickDown    = "KEY:S"
# RightStickLeft   = "KEY:J"
# RightStickRight  = "KEY:L"
# RightStickUp     = "KEY:I"
# RightStickDown   = "KEY:K"
# TouchPad         = "KEY:Tab"
# TouchLeft        = []
# TouchRight       = []
# ToggleFullscreen = "KEY:F11"
# TogglePerfOverlay = "KEY:F10"     # performance overlay (FPS, frame times, CPU/GPU)
# ToggleMenu = "KEY:F1"            # in-game menu (keyboard keys only; the PS button also opens it)
# ShowControls     = "KEY:F2"           # hold: the current bindings over the running game (keyboard keys only)
# Create           = "KEY:F12"
# Mute             = "KEY:F8"
# TiltForward      = "KEY:Keypad 8"
# TiltBack         = "KEY:Keypad 2"
# TiltLeft         = "KEY:Keypad 4"
# TiltRight        = "KEY:Keypad 6"
# TurnLeft         = "KEY:Keypad 7"
# TurnRight        = "KEY:Keypad 9"
# Shake            = "KEY:Keypad 5"
# TouchpadMode     = "KEY:Keypad 0"
# TapCenter        = "KEY:PageUp"
# SwipeUp          = "KEY:Home"
# SwipeDown        = "KEY:End"
# SwipeLeft        = "KEY:Delete"
# SwipeRight       = "KEY:PageDown"
# TwoFingerTouch   = "KEY:Insert"

# Controller button layout (all controllers are read in the PS layout; Xbox
# A/B/X/Y act as Cross/Circle/Square/Triangle). Pad button actions only. Sources
# are BUTTON:<name>: South East West North Back Guide Start LeftStick
# RightStick LeftShoulder RightShoulder DpadUp DpadDown DpadLeft DpadRight
# Misc1 RightPaddle1 LeftPaddle1 RightPaddle2 LeftPaddle2 Touchpad
# LeftTrigger RightTrigger (PS aliases work too: Cross, L1, R3, Options, ...).
# Back/View presses the touch pad on controllers without one unless bound.
[gamepad_bindings]
# Cross            = "BUTTON:South"
# Circle           = "BUTTON:East"
# Square           = "BUTTON:West"
# Triangle         = "BUTTON:North"
# L1               = "BUTTON:LeftShoulder"
# R1               = "BUTTON:RightShoulder"
# Options          = "BUTTON:Start"
# L3               = "BUTTON:LeftStick"
# R3               = "BUTTON:RightStick"
# Up               = "BUTTON:DpadUp"
# Right            = "BUTTON:DpadRight"
# Down             = "BUTTON:DpadDown"
# Left             = "BUTTON:DpadLeft"
# TouchPad         = "BUTTON:Touchpad"

[mouse]
# sensitivity = 1.0    # mouse-look (ToggleMouse) sensitivity
# invert_x = false
# invert_y = false
# guest_mouse = false  # also expose the host mouse to the game (libSceMouse)

[gamepad]
# enabled = true            # SDL3 game controllers
# rumble = true             # scePadSetVibration
# rumble_strength = 1.0     # 0..2
# lightbar = true           # scePadSetLightBar / ResetLightBar
# adaptive_triggers = true  # scePadSetTriggerEffect (DualSense)
# motion = true             # gyro + accelerometer
# touchpad = true           # touch pad fingers
# speaker_volume = 50       # DualSense speaker level 0..100 (50 = unity)
# vibration_intensity = 100 # vibration level 0..100
# lightbar_color = ""       # fixed light bar colour "#RRGGBB" (overrides the game's)

[sticks]
# What drives each stick from the keyboard and mouse (a controller's stick always
# does): "keys" (its four direction actions), "mouse" (mouse-look while the mouse
# is captured) or "off" (controller only). The mouse drives one stick: giving it
# to one puts the other on its keys. Keyboard-only mode uses keys for "mouse".
# left_mode = "keys"
# right_mode = "mouse"
# Swap the keyboard and mouse between the sticks: the left stick's keys and
# mouse-look move the right stick and the other way round (WASD on the right
# stick, the mouse on the left). A controller's sticks are not swapped.
# swap = false
# Radial dead zone (fraction of full deflection, 0..0.9) and response curve
# exponent (0.2..5; 1 is linear, above 1 gives finer control near the centre).
# left_deadzone = 0.0
# left_curve = 1.0
# right_deadzone = 0.0
# right_curve = 1.0

[triggers]
# deadzone = 0.0
# curve = 1.0

[motion]
# Motion sensors from the keyboard and mouse (Tilt*, Turn*, Shake, MouseMotion).
# They report what a DualSense would: an orientation, gravity in the
# accelerometer and the turn rate in the gyroscope. A controller's own sensors
# are used while these are idle.
# tilt_angle = 30.0         # degrees a held tilt key tips the controller (1..90)
# tilt_time = 0.25          # seconds to get there and back (0.02..2)
# mouse_sensitivity = 1.0   # MouseMotion: 1 = 0.05 degrees per mouse count

[touchpad]
# mouse_sensitivity = 1.0   # touch pad mode: 1 = 800 mouse counts across the pad
